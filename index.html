<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xontrex</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07152d;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            padding: 40px 20px;
        }

        .logo {
            font-size: 55px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #b9c3d4;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .descripcion {
            font-size: 18px;
            line-height: 1.6;
            color: #e5e9f0;
            margin-bottom: 35px;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .boton {
            text-decoration: none;
            color: white;
            border: 1px solid #ffffff55;
            padding: 14px 25px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .boton:hover {
            background: white;
            color: #07152d;
        }

        footer {
            margin-top: 50px;
            color: #7f8ba0;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <div class="logo">XONTREX</div>

        <div class="subtitulo">
            Phrases • Memes • Culture
        </div>

        <p class="descripcion">
            Bienvenido a Xontrex.
            Un espacio creado para compartir contenido,
            ideas y momentos que conectan con una nueva generación.
        </p>

        <div class="botones">
            <a class="boton" href="#">TikTok</a>
            <a class="boton" href="#">Instagram</a>
            <a class="boton" href="#">YouTube</a>
        </div>

        <footer>
            © 2026 Xontrex. Todos los derechos reservados.
        </footer>

    </main>

</body>
</html>
